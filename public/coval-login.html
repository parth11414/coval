       COVAL monochrome design system
       Dark is the default; .light-mode is toggled on <body>.
       ─────────────────────────────────────────────── */
    :root {
      color-scheme: dark;
      --mono: "DM Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      --bg: #000000;
      --bg-soft: #0A0A0A;
      --surface: #111111;
      --surface-2: #1A1A1A;
      --border: #262626;
      --border-strong: #404040;
      --fg: #FFFFFF;
      --fg-2: #E5E5E5;
      --muted: #A3A3A3;
      --faint: #737373;
      --btn-bg: #FFFFFF;
      --btn-fg: #000000;
      --btn-hover: #E5E5E5;
      --ring: rgba(255, 255, 255, .14);
      --card-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 70px rgba(0, 0, 0, .65);
      --mascot-drop: drop-shadow(0 3px 8px rgba(0,0,0,.55));
    }

    body.light-mode {
      --bg: #FAFAFA;
      --bg-soft: #F5F5F5;
      --surface: #FFFFFF;
      --surface-2: #F5F5F5;
      --border: #E5E5E5;
      --border-strong: #D4D4D4;
      --fg: #000000;
      --fg-2: #171717;
      --muted: #404040;
      --faint: #737373;
      --btn-bg: #000000;
      --btn-fg: #FFFFFF;
      --btn-hover: #171717;
      --ring: rgba(0, 0, 0, .09);
      --card-shadow: 0 1px 2px rgba(0,0,0,.04), 0 18px 50px rgba(0, 0, 0, .07);
      --mascot-drop: drop-shadow(0 2px 4px rgba(0,0,0,.14));
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    /* logo asset swap: white artwork on dark, black artwork on light */
    body .logo-on-light { display: none !important; }
    body.light-mode .logo-on-light { display: block !important; }
    body.light-mode .logo-on-dark { display: none !important; }

    .terminal {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
      background: radial-gradient(ellipse at 50% 30%, #131313 0%, #0A0A0A 48%, #000000 100%);
    }
    .light-mode .terminal {
      background: radial-gradient(ellipse at 50% 30%, #FFFFFF 0%, #FAFAFA 55%, #F5F5F5 100%);
    }
    .terminal::before, .terminal::after { content: none; }
    .grain { display: none; }

    .topline {
      position: absolute;
      z-index: 2;
      top: 30px;
      left: 44px;
      right: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--faint);
      font: 500 10px var(--sans);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .topline { pointer-events: none; }
    .home-link {
      pointer-events: auto;
      margin: -8px -10px;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font: 600 11px var(--sans);
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: 0;
      visibility: hidden;
      transition: opacity .4s, visibility 0s .4s, color .2s;
    }
    .revealed .home-link { opacity: 1; visibility: visible; transition: opacity .5s .5s, visibility 0s .5s, color .2s; }
    .home-link:hover { color: var(--fg); }
    .home-link:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .topline .status { display: flex; align-items: center; gap: 9px; }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: status-pulse 2.8s ease-in-out infinite;
    }
    @keyframes status-pulse { 50% { opacity: .3; } }

    .login-shell {
      position: relative;
      z-index: 1;
      width: min(432px, calc(100vw - 36px));
      padding: 36px 38px 36px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
      opacity: 0;
      transform: translateY(24px) scale(.985);
      transition: opacity .75s .36s ease, transform .9s .32s cubic-bezier(.18,.8,.2,1), border-color .3s;
    }
    .revealed .login-shell { opacity: 1; transform: translateY(0) scale(1); }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand-logo {
      display: block;
      width: 150px;
      height: auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--faint);
      font: 600 10px var(--sans);
      letter-spacing: .22em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--fg);
      font-size: clamp(24px, 5vw, 28px);
      font-weight: 600;
      letter-spacing: -.02em;
      text-align: center;
    }
    .intro-copy {
      margin: 10px auto 26px;
      max-width: 300px;
      color: var(--faint);
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.7;
      text-align: center;
    }
    .light-mode .intro-copy { color: #737373; }
    body:not(.light-mode) .intro-copy { color: var(--muted); }

    .field { display: block; margin-top: 18px; }
    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--fg-2);
      font: 600 10px var(--sans);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 14px;
      outline: 0;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font: 500 13px var(--sans);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .light-mode .input-wrap input { background: #FFFFFF; border-color: #D4D4D4; }
    .input-wrap input:hover { border-color: var(--faint); }
    .input-wrap input:focus {
      border-color: var(--fg);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .input-icon {
      position: absolute;
      top: 50%;
      right: 14px;
      width: 14px;
      height: 14px;
      color: var(--faint);
      transform: translateY(-50%);
    }

    .form-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 22px;
      color: var(--faint);
      font: 500 10px var(--sans);
      letter-spacing: .04em;
    }
    .secure { display: inline-flex; align-items: center; gap: 6px; letter-spacing: .1em; }
    .secure svg { width: 12px; height: 12px; color: var(--muted); }
    .reset {
      color: var(--fg-2);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: var(--border-strong);
      text-underline-offset: 3px;
      transition: color .2s, text-decoration-color .2s;
    }
    .reset:hover { color: var(--fg); text-decoration-color: var(--fg); }
    .reset:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 2px; }

    .access-button {
      position: relative;
      display: flex;
      width: 100%;
      height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
      border: 1px solid var(--btn-bg);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: background .2s, border-color .2s, transform .18s;
    }
    .access-button::before { content: none; }
    .access-button:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
    .access-button:active { transform: translateY(1px) scale(.995); }
    .access-button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .access-button span, .access-button svg { position: relative; z-index: 1; }
    .access-button svg { width: 14px; height: 14px; transition: transform .2s; }
    .access-button:hover svg { transform: translateX(2px); }

    .card-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--faint);
      font: 400 9px var(--mono);
      letter-spacing: .08em;
    }

    /* ───── Intro curtain ───── */
    .curtain {
      position: fixed;
      z-index: 8;
      inset: 0;
      overflow: hidden;
      color: var(--fg);
      background: radial-gradient(ellipse at 50% 40%, #121212 0%, #0A0A0A 50%, #000000 100%);
      transition: transform 1.28s cubic-bezier(.72, 0, .17, 1);
      touch-action: none;
    }
    .light-mode .curtain {
      background: radial-gradient(ellipse at 50% 40%, #FFFFFF 0%, #FAFAFA 55%, #F5F5F5 100%);
    }
    .curtain::before, .curtain::after { content: none; }
    .curtain.is-gone { transform: translateY(105%); pointer-events: none; }
    .curtain-content {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(620px, calc(100vw - 40px));
      text-align: center;
      transform: translate(-50%, -50%);
    }
    .curtain h2 { margin: 0; line-height: 0; }
    .curtain h2 img { display: block; width: min(500px, 80vw); height: auto; margin: 0 auto; }
    .curtain-copy {
      max-width: 392px;
      margin: 30px auto 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .22em;
      line-height: 1.75;
      text-transform: uppercase;
    }
    .light-mode .curtain-copy { color: #737373; }
    .enter-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 34px; }
    .enter-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 22px;
      border: 1px solid var(--btn-bg);
      border-radius: 100px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      font: 600 11px var(--sans);
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .enter-button:hover { transform: translateY(-2px); background: var(--btn-hover); border-color: var(--btn-hover); }
    .enter-button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .enter-button svg { width: 13px; height: 13px; }
    .drag-hint { color: var(--faint); font: 500 10px var(--sans); letter-spacing: .04em; }
    .corner-note {
      position: absolute;
      z-index: 1;
      bottom: 30px;
      left: 36px;
      color: var(--faint);
      font: 500 9px var(--sans);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .corner-index {
      position: absolute;
      z-index: 1;
      right: 38px;
      bottom: 30px;
      color: var(--faint);
      font: 400 9px var(--mono);
      letter-spacing: .06em;
    }

    /* ───── Cursor mark (monochrome COVAL "C") ───── */
    .mascot {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 44px;
      aspect-ratio: 92 / 96;
      cursor: grab;
      touch-action: none;
      user-select: none;
      filter: var(--mascot-drop);
      will-change: left, top, transform;
    }
    .mascot.grabbed { cursor: grabbing; }
    .mascot svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .mascot .mark-ring,
    .mascot .mark-hex {
      fill: var(--fg);
      stroke: var(--bg);
      stroke-width: 36;
      stroke-linejoin: round;
      paint-order: stroke;
    }
    .mascot .mascot-core { transform-box: fill-box; transform-origin: center; }
    .mascot.running .mascot-core { animation: body-run .17s ease-in-out infinite alternate; }
    .mascot:not(.running):not(.grabbed) .mascot-core { animation: body-idle 1.6s ease-in-out infinite; }
    @keyframes body-run { to { transform: translateY(-2px) scale(1.03,.97); } }
    @keyframes body-idle { 50% { transform: translateY(-2px); } }

    .prompt {
      position: fixed;
      z-index: 9;
      right: 28px;
      bottom: 25px;
      color: var(--faint);
      font: 500 9px var(--sans);
      letter-spacing: .16em;
      opacity: 0;
      transition: opacity .5s;
      pointer-events: none;
    }
    .revealed .prompt { opacity: 1; }

    .trail-particle {
      position: fixed;
      z-index: 7;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--faint);
      opacity: .6;
      pointer-events: none;
      animation: trail-fade .5s ease-out forwards;
    }
    @keyframes trail-fade { to { opacity: 0; transform: scale(.15) translateY(5px); } }

    /* ───── Theme toggle ───── */
    .theme-toggle {
      position: fixed;
      z-index: 11;
      top: 22px;
      right: 28px;
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s, color .2s, background .2s, border-color .2s, transform .2s;
    }
    .revealed .theme-toggle { opacity: 1; pointer-events: auto; }
    .theme-toggle:hover { transform: translateY(-1px); border-color: var(--fg); background: var(--surface-2); }
    .theme-toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .theme-toggle svg { width: 16px; height: 16px; }
    .theme-toggle .sun-icon { display: none; }
    .light-mode .theme-toggle .sun-icon { display: block; }
    .light-mode .theme-toggle .moon-icon { display: none; }

    /* ───── Toast / success ───── */
    .toast {
      position: fixed;
      z-index: 12;
      top: 25px;
      left: 50%;
      max-width: calc(100vw - 28px);
      padding: 12px 18px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--fg);
      box-shadow: var(--card-shadow);
      font: 600 10px var(--sans);
      letter-spacing: .08em;
      opacity: 0;
      transform: translate(-50%, -12px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .success .login-shell { border-color: var(--fg); }
    .success .mascot { animation: celebrate .75s cubic-bezier(.2,.8,.25,1); }
    @keyframes celebrate { 25% { rotate: -16deg; scale: 1.18; } 55% { rotate: 12deg; scale: .92; } 100% { rotate: 0; scale: 1; } }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 760px) {
      .login-shell { padding: 28px 34px 28px; }
      .brand { margin-bottom: 16px; }
      .brand-logo { width: 118px; }
      .intro-copy { margin-bottom: 14px; }
      .field { margin-top: 13px; }
      .form-meta { margin: 12px 0 16px; }
      .card-footer { margin-top: 16px; padding-top: 12px; }
    }
    @media (max-height: 640px) {
      .brand-logo { width: 96px; }
      .eyebrow { display: none; }
    }

    @media (max-width: 600px) {
      .topline { top: 19px; left: 18px; right: 62px; font-size: 8px; }
      .login-shell { padding: 28px 24px 28px; }
      .mascot { width: 40px; }
      .theme-toggle { top: 12px; right: 14px; width: 34px; height: 34px; }
      
      .enter-row { flex-direction: column; gap: 12px; }
      .corner-note { left: 17px; bottom: 18px; font-size: 7px; }
      .corner-index { right: 18px; bottom: 18px; }
      .prompt { right: 12px; bottom: 12px; font-size: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .curtain, .login-shell { transition-duration: .01ms !important; }
    }
  </style>

      function animate(now) {

      form.appendChild(oauthRow);

  <script>
    /* The cursor mark follows the pointer and can sit directly on top of buttons,
       swallowing the click. A tap (not a drag) on the mark is passed through to the
       control beneath it, so "Enter workspace" and the other buttons always respond. */
    (() => {
      const mascot = document.getElementById("mascot");
      let start = null;
      mascot.addEventListener("pointerdown", e => { start = { x: e.clientX, y: e.clientY }; });
      mascot.addEventListener("pointerup", e => {
        if (!start) return;
        const moved = Math.hypot(e.clientX - start.x, e.clientY - start.y);
        start = null;
        if (moved > 8) return;
        const target = document.elementsFromPoint(e.clientX, e.clientY)
          .find(el => el !== mascot && !mascot.contains(el) && el.closest("button, a[href], input"));
        if (target) target.closest("button, a[href], input").click();
      });
    })();
